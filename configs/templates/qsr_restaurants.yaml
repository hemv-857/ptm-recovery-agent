# QSR / Restaurants preset — Paytm QR + wallet recovery.
# Use with: RECOVERY_CONFIG=configs/templates/qsr_restaurants.yaml
# Restaurants, fuel pumps, food courts — offline-first, QR recovery, wallet upsell.
policy:
  max_attempts_per_case: 3
  attempt_window_hours: 48
  cooldown_minutes: 120
  quiet_hours_ist: [22, 8]
  auto_action_cap_paise: 100000   # Rs 1k: QSR is low-value
  final_followup_hours: 72
  case_expiry_hours: 96

channels:
  sms:
    cost_paise: 15
    enabled: true
  whatsapp:
    cost_paise: 30
    enabled: true
  email:
    cost_paise: 2
    enabled: false
  voice:
    cost_paise: 300
    enabled: false
  payment_link:
    cost_paise: 0

retry:
  network_timeout_backoff_min: 20
  issuer_unavailable_backoff_min: 45
  telecom_backoff_min: 30
  salary_cycle_days: []   # QSR: immediate, don't wait for salary
  voice_min_amount_paise: 2500000

world:
  base_pay_probability:
    INSUFFICIENT_FUNDS: 0.45
    NETWORK_TIMEOUT: 0.60
    ISSUER_UNAVAILABLE: 0.55
    SOFT_DECLINE_OTHER: 0.35
    HARD_DECLINE: 0.05
    MANDATE_ISSUE: 0.25
    CUSTOMER_ABANDONMENT: 0.40
    INVOICE_OVERDUE: 0.30
    SUBSCRIPTION_FAILED: 0.25
    UNKNOWN: 0.20
    WALLET_INSUFFICIENT: 0.50
    TELECOM_NETWORK: 0.60
    GATEWAY_LATENCY: 0.65
    OFFLINE_PAYMENT_PENDING: 0.75
  control_baseline_scale: 0.55
  channel_effectiveness:
    whatsapp: 1.0
    sms: 0.85
    email: 0.40
    payment_link: 0.9
    voice: 0.50
  fatigue_decay_per_contact: 0.80
  opt_out_probability_per_contact: 0.015
  promise_reply_probability: 0.10
  promise_keep_probability: 0.45
  salary_alignment_boost: 1.0   # no salary alignment for QSR
  quiet_hour_penalty: 0.6
  seed: 42

simulation:
  batch_size: 2000
  horizon_days: 3
