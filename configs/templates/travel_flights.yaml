# Travel / Flights preset — time-critical, voice priority.
# Use with: RECOVERY_CONFIG=configs/templates/travel_flights.yaml
# Time-sensitive bookings, voice-first for high-value, fast escalation.
policy:
  max_attempts_per_case: 3
  attempt_window_hours: 72
  cooldown_minutes: 180
  quiet_hours_ist: [22, 7]
  auto_action_cap_paise: 1000000   # Rs 10k: travel is higher value
  final_followup_hours: 96
  case_expiry_hours: 120

channels:
  sms:
    cost_paise: 15
    enabled: true
  whatsapp:
    cost_paise: 30
    enabled: true
  email:
    cost_paise: 2
    enabled: true
  voice:
    cost_paise: 300
    enabled: true
  payment_link:
    cost_paise: 0

retry:
  network_timeout_backoff_min: 15
  issuer_unavailable_backoff_min: 30
  telecom_backoff_min: 20
  salary_cycle_days: []
  voice_min_amount_paise: 1000000   # lower threshold: voice-first for travel

world:
  base_pay_probability:
    INSUFFICIENT_FUNDS: 0.50
    NETWORK_TIMEOUT: 0.65
    ISSUER_UNAVAILABLE: 0.55
    SOFT_DECLINE_OTHER: 0.35
    HARD_DECLINE: 0.08
    MANDATE_ISSUE: 0.20
    CUSTOMER_ABANDONMENT: 0.30
    INVOICE_OVERDUE: 0.35
    SUBSCRIPTION_FAILED: 0.25
    UNKNOWN: 0.20
    TELECOM_NETWORK: 0.60
    GATEWAY_LATENCY: 0.65
  control_baseline_scale: 0.55
  channel_effectiveness:
    whatsapp: 1.0
    sms: 0.85
    email: 0.55
    payment_link: 0.9
    voice: 0.85   # higher voice effectiveness for travel
  fatigue_decay_per_contact: 0.75
  opt_out_probability_per_contact: 0.010
  promise_reply_probability: 0.15
  promise_keep_probability: 0.50
  salary_alignment_boost: 1.0
  quiet_hour_penalty: 0.6
  seed: 42

simulation:
  batch_size: 2000
  horizon_days: 5
