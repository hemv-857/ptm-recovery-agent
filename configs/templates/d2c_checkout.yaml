# D2C checkout-abandonment preset (Blinkit-style fast commerce, cart drop-offs).
# Use with: RECOVERY_CONFIG=configs/templates/d2c_checkout.yaml
# Intent is hot but decays in hours — the ladder front-loads everything.
policy:
  max_attempts_per_case: 3          # three touches inside two days, then stop
  attempt_window_hours: 48          # a nudge about yesterday's cart is dead by day 3
  cooldown_minutes: 120             # short cycle while intent is warm
  quiet_hours_ist: [22, 8]
  auto_action_cap_paise: 1000000    # Rs 10k cap: typical carts are small
  final_followup_hours: 72
  case_expiry_hours: 120            # expire fast; stale carts are not receivables

channels:
  sms:
    cost_paise: 15
    enabled: true
  whatsapp:
    cost_paise: 30
    enabled: true                   # workhorse: CTA click-through lives here
  email:
    cost_paise: 2
    enabled: true                   # cheap third touch with the cart link
  voice:
    cost_paise: 300
    enabled: false                  # a phone call about an abandoned cart? no.
  payment_link:
    cost_paise: 0

retry:
  network_timeout_backoff_min: 20
  issuer_unavailable_backoff_min: 45
  salary_cycle_days: []             # impulse purchases ignore salary cycles
  voice_min_amount_paise: 2500000   # unreachable anyway while voice is disabled

world:                              # simulator only
  base_pay_probability:
    INSUFFICIENT_FUNDS: 0.50
    NETWORK_TIMEOUT: 0.65
    ISSUER_UNAVAILABLE: 0.60
    SOFT_DECLINE_OTHER: 0.40
    HARD_DECLINE: 0.06
    MANDATE_ISSUE: 0.32
    CUSTOMER_ABANDONMENT: 0.35      # fresher intent than the default cohort mix
    INVOICE_OVERDUE: 0.38
    SUBSCRIPTION_FAILED: 0.30
    UNKNOWN: 0.25
  control_baseline_scale: 0.55
  channel_effectiveness:
    whatsapp: 1.0
    sms: 0.85
    email: 0.55
    payment_link: 0.9
    voice: 0.72
  fatigue_decay_per_contact: 0.82
  opt_out_probability_per_contact: 0.010
  promise_reply_probability: 0.12   # "kal karta hoon" happens, but carts are now-or-never
  promise_keep_probability: 0.5
  salary_alignment_boost: 1.35
  quiet_hour_penalty: 0.6
  seed: 42

simulation:
  batch_size: 2000
  horizon_days: 7
