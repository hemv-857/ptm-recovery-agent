<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paytm Revenue Recovery Dashboard</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#002970">
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
    <script src="/static/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css?v=2">
</head>
<body>
    <div id="root"></div>

    <script>
    window.__gsapTabIn=function(sel){
        if(typeof gsap==="undefined")return;
        gsap.from(sel,{opacity:0,y:14,duration:.35,ease:"power2.out",stagger:.05});
    };
    </script>
    <script>window.__API_BASE__ = "";</script>
    <script>
    (function(){
        var boot=function(){
            if(typeof Babel==="undefined"||!Babel.availablePresets||!Babel.availablePresets.react)return setTimeout(boot,10);
            Babel.registerPreset("react-classic",{presets:[[Babel.availablePresets.react,{runtime:"classic"}]]});
        };
        boot();
    })();
    </script>
    <script type="text/babel" src="/static/dashboard.jsx?v=8" data-presets="react-classic"></script>
</body>
</html>
