<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Recovery Agent — Dashboard</title>
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
    <script src="/static/vendor/gsap.min.js"></script>
    <!-- air-gapped: no external font/CDN loads; system-ui fallback stack -->
    <style>  @font-face{
    font-family:var(--font-sans);
  font-style:normal;font-weight:100 900;font-stretch:normal;
  src:local('Inter Variable'),local('Inter-Variable'),
      url('/static/vendor/fonts/InterVariable.woff2') format('woff2-variations'),
      url('/static/vendor/fonts/InterVariable.woff2') format('woff2');
  font-display:swap;
}

        :root{--bg:#F5F7FA;--card:#FFFFFF;--card-hover:#F0F4F8;--bdr:#E8ECF0;--bdr-h:#D0D5DD;--txt:#1A1A1A;--sec:#666666;--dim:#999999;--grn:#22c55e;--blu:#002970;--pur:#00BAF2;--red:#E42352;--yel:#eab308;--cyn:#00BAF2;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--paytm-navy:#002970;--paytm-cyan:#00BAF2;--paytm-blue:#002970;--paytm-crimson:#E42352;--paytm-light:#7FDBFF;--gradient:linear-gradient(135deg,#002970,#00BAF2);--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 12px rgba(0,0,0,.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font-sans);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.2)}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
        @keyframes slideR{from{width:0}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
        @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        .a-fu{animation:fadeUp .45s ease both}
        .d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}.d5{animation-delay:.2s}.d6{animation-delay:.24s}

        /* Layout */
        .layout{display:flex;min-height:100vh}
        .sidebar{width:210px;background:#FFFFFF;border-right:1px solid var(--bdr);padding:18px 0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:50;box-shadow:1px 0 4px rgba(0,0,0,.04)}
        .sidebar-logo{padding:0 18px 16px;border-bottom:1px solid var(--bdr);margin-bottom:12px}
        .sidebar-logo h1{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--paytm-blue)}
        .logo-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#002970,#00BAF2);color:#fff;font-size:11px;font-weight:800;margin-right:7px;vertical-align:-4px;box-shadow:0 1px 3px rgba(0,41,112,.3)}
        .sidebar-logo .sub{font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
        .nav{padding:0 10px;flex:1}
        .nav-section{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px;font-weight:700}
        .nav-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--sec);transition:all .15s;display:flex;align-items:center;gap:9px;margin-bottom:1px;user-select:none}
        .nav-item:hover{background:var(--card-hover);color:var(--txt)}
        .nav-item.active{background:rgba(0,41,112,.08);color:var(--paytm-blue);font-weight:600}
        .nav-item .icon{font-size:14px;width:18px;text-align:center}
        .sidebar-footer{padding:12px 18px;border-top:1px solid var(--bdr);font-size:9px;color:var(--dim)}
        .sidebar-disclaimer{margin-top:8px;font-size:8.5px;color:var(--dim);font-style:italic;line-height:1.4;letter-spacing:.01em}
        .main{flex:1;margin-left:210px}
        .topbar{background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.06);border-bottom:1px solid var(--bdr);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .tb-left{display:flex;align-items:center;gap:12px}
        .tb-right{display:flex;align-items:center;gap:8px}
        .badge{font-size:8px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid rgba(34,197,94,.4);color:#16a34a;text-transform:uppercase;font-weight:700;background:rgba(34,197,94,.06)}
        .badge.warn{border-color:rgba(234,179,8,.4);color:#ca8a04;background:rgba(234,179,8,.06)}
        .badge.live{border-color:rgba(0,41,112,.4);color:var(--paytm-blue);animation:pulse 2s infinite;background:rgba(0,41,112,.06)}
        .badge.pur{border-color:rgba(0,186,242,.4);color:#0084B4;background:rgba(0,186,242,.06)}
        .content{padding:22px 24px}

        /* Cards — hover lift */
        .card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
        .card:hover{border-color:var(--bdr-h);box-shadow:var(--shadow-lg)}
        .card-header{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
        .card-header h2{font-size:12px;font-weight:700}
        .card-body{padding:16px}

        /* Metrics — hover lift */
        .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
        .metric{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;transition:all .22s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
        .metric:hover{border-color:var(--bdr-h);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
        .metric.primary{border-color:rgba(0,41,112,.2);background:rgba(0,41,112,.03)}
        .metric-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:5px}
        .metric-value{font-size:22px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt)}
        .metric-sub{font-size:10px;color:var(--dim);margin-top:3px}
        @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:600px){.metrics{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0}}

        /* Grid layouts */
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
        .grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
        @media(max-width:1100px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
        @media(max-width:768px){.grid-4{grid-template-columns:1fr 1fr}}

        /* Buttons — lift on hover */
        .btn{padding:7px 14px;border-radius:7px;font-weight:600;cursor:pointer;font-size:11px;font-family:var(--font-sans);transition:all .15s cubic-bezier(.4,0,.2,1);border:none;background:var(--paytm-blue);color:#fff;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
        .btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,41,112,.2)}
        .btn:active{transform:translateY(0)}
        .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
        .btn-sm{padding:4px 10px;font-size:10px}
        .btn-xs{padding:3px 8px;font-size:9px;border-radius:5px}
        .btn-outline{background:transparent;border:1px solid var(--bdr);color:var(--sec)}
        .btn-outline:hover{background:var(--card-hover);border-color:var(--bdr-h);box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .btn-grn{background:var(--grn)}.btn-grn:hover{box-shadow:0 4px 12px rgba(34,197,94,.2)}
        .btn-red{background:var(--red)}.btn-red:hover{box-shadow:0 4px 12px rgba(228,35,82,.2)}
        .btn-yel{background:var(--yel);color:#000}.btn-yel:hover{box-shadow:0 4px 12px rgba(234,179,8,.2)}


        /* Tags */
        .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:700;background:var(--card-hover);color:var(--sec);font-family:var(--mono);border:1px solid var(--bdr)}

        .tag-green{background:rgba(34,197,94,.08);color:#16a34a;border:1px solid rgba(34,197,94,.2)}
        .tag-red{background:rgba(228,35,82,.08);color:#DC2626;border:1px solid rgba(228,35,82,.2)}
        .tag-yellow{background:rgba(234,179,8,.08);color:#ca8a04;border:1px solid rgba(234,179,8,.2)}
        .tag-blue{background:rgba(0,41,112,.06);color:var(--paytm-blue);border:1px solid rgba(0,41,112,.15)}

        /* Status pills */
        .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
        .pill.recovered{background:rgba(34,197,94,.1);color:#16a34a}
        .pill.written_off{background:rgba(228,35,82,.1);color:#DC2626}
        .pill.open,.pill.scheduled{background:rgba(0,41,112,.08);color:var(--paytm-blue)}

        /* Table */
        table{width:100%;border-collapse:collapse;font-size:11px}
        th{text-align:left;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--bdr);font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}
        td{padding:8px 10px;border-bottom:1px solid var(--bdr);color:var(--txt)}
        tr:hover td{background:var(--card-hover)}
        tr{transition:background .1s}

        /* Forms */
        .form-label{display:block;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:3px}
        .form-input{width:100%;padding:7px 9px;background:var(--card);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-size:11px;font-family:var(--font-sans);transition:border-color .15s}
        .form-input:focus{outline:none;border-color:var(--paytm-blue);box-shadow:0 0 0 2px rgba(0,41,112,.1)}
        select.form-input{cursor:pointer}
        textarea.form-input{resize:vertical;min-height:60px;font-family:var(--mono);font-size:10px}

        /* Bars */
        .bar-g{margin-bottom:10px}
        .bar-l{display:flex;justify-content:space-between;margin-bottom:3px}
        .bar-l span:first-child{color:var(--sec);font-size:10px;font-weight:500}
        .bar-l span:last-child{color:var(--txt);font-size:13px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .bar{height:16px;background:var(--bdr);border-radius:4px;overflow:hidden}
        .bf{height:100%;border-radius:4px;animation:slideR 1s ease both}
        .bf.t{background:linear-gradient(90deg,#002970,#00BAF2)}.bf.c{background:linear-gradient(90deg,#475569,#64748b)}.bf.n{background:linear-gradient(90deg,#eab308,#fbbf24)}

        /* Hero */
        .hero{background:linear-gradient(135deg,#002970,#00B4F2);border:none;border-radius:12px;padding:24px 28px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;transition:all .2s;box-shadow:0 4px 16px rgba(0,41,112,.15)}
        .hero:hover{box-shadow:0 8px 24px rgba(0,41,112,.2)}
        .h-label{color:var(--sec);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
        .h-amt{font-size:38px;font-weight:800;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums;color:#FFFFFF}
        .h-sub{color:#7FDBFF;font-size:13px;font-weight:600;margin-top:5px}
        .h-ci{color:var(--dim);font-size:10px;margin-top:3px;font-family:var(--mono)}
        .h-delta{text-align:center;padding:6px 0}
        .h-dv{font-size:20px;font-weight:800;color:#7FDBFF;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .h-dl{color:var(--dim);font-size:10px;margin-top:2px}
        @media(max-width:900px){.hero{grid-template-columns:1fr}}

        /* Queue item */


        /* Chips */
        .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
        .chip{background:rgba(228,35,82,.06);border:1px solid rgba(228,35,82,.2);color:#DC2626;border-radius:999px;padding:2px 8px;font-size:10px}
        .chip.ok{border-color:rgba(34,197,94,.2);color:#16a34a;background:rgba(34,197,94,.06)}

        /* Modal — fade+scale in */
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
        .modal.on{display:flex}
        .modal-c{background:#FFFFFF;border-radius:14px;padding:22px;max-width:500px;width:100%;border:1px solid var(--bdr);animation:modalIn .25s ease;box-shadow:0 24px 48px rgba(0,0,0,.15)}
        .modal-c h2{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--txt)}

        /* Toast — slide in */
        .toast{position:fixed;top:14px;right:14px;background:#FFFFFF;border:1px solid var(--bdr);border-radius:8px;padding:9px 14px;font-size:11px;font-weight:600;z-index:2000;animation:toastIn .25s ease;box-shadow:0 4px 12px rgba(0,0,0,.1);color:var(--txt)}

        /* Skeleton shimmer */
        .skeleton{background:linear-gradient(90deg,var(--bdr) 25%,var(--card-hover) 50%,var(--bdr) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}

        .sk-card{height:80px;border-radius:10px;margin-bottom:12px}

        /* Architecture flow */
        .arch-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 0}
        .arch-node{background:rgba(0,41,112,.06);border:1px solid rgba(0,41,112,.15);border-radius:7px;padding:7px 12px;font-size:10px;font-weight:600;color:var(--paytm-blue);white-space:nowrap;transition:all .15s}
        .arch-node:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,41,112,.1)}
        .arch-node.highlight{border-color:rgba(0,186,242,.3);background:rgba(0,186,242,.06);color:#0084B4}
        .arch-arrow{color:var(--dim);font-size:12px}

        /* Stepper */
        .stepper{display:flex;gap:0;margin:12px 0}
        .step{flex:1;text-align:center;padding:8px 4px;font-size:9px;font-weight:600;color:var(--dim);border-bottom:2px solid var(--bdr);transition:all .3s}
        .step.active{color:var(--paytm-blue);border-bottom-color:var(--paytm-blue)}
        .step.done{color:var(--grn);border-bottom-color:var(--grn)}
        .step-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bdr);display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-bottom:4px;transition:all .3s}
        .step.active .step-dot{border-color:var(--paytm-blue);background:rgba(0,41,112,.1);color:var(--paytm-blue)}
        .step.done .step-dot{border-color:var(--grn);background:rgba(34,197,94,.1);color:var(--grn)}

        /* Funnel */
        .funnel{display:flex;align-items:center;gap:4px;margin:12px 0}
        .funnel-stage{flex:1;text-align:center;padding:10px 6px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;transition:all .2s}
        .funnel-stage:hover{border-color:var(--bdr-h);box-shadow:var(--shadow)}
        .funnel-num{font-size:18px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt)}
        .funnel-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
        .funnel-arrow{color:var(--dim);font-size:11px;flex-shrink:0}

        /* Feature grid */
        .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .feat-item{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:12px;transition:all .2s}
        .feat-item:hover{border-color:var(--bdr-h);transform:translateY(-1px);box-shadow:var(--shadow)}
        .feat-icon{font-size:16px;margin-bottom:5px}
        .feat-title{font-size:11px;font-weight:600;margin-bottom:2px}
        .feat-desc{font-size:9px;color:var(--dim);line-height:1.5}
        @media(max-width:900px){.feat-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.feat-grid{grid-template-columns:1fr}}

        /* Tech tags */


        /* CTA */


        /* Mono + tabular */
        .mono{font-family:var(--mono)}.tabular{font-variant-numeric:tabular-nums}

        /* Sound toggle */
        .sound-toggle{cursor:pointer;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sec);padding:3px 8px;border-radius:5px;border:1px solid var(--bdr);transition:all .15s}
        .sound-toggle:hover{background:var(--card-hover)}

        /* Search */
        .search-input{padding:6px 10px 6px 28px;background:var(--card);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-size:11px;font-family:var(--font-sans);width:180px;transition:all .2s}
        .search-input:focus{outline:none;border-color:var(--paytm-blue);width:220px;box-shadow:0 0 0 2px rgba(0,41,112,.1)}
        .search-wrap{position:relative}
        .search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none}

        /* Approval row */
        .approval-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:11px}
        .approval-row:last-child{border-bottom:none}

        /* Security grid */
        .sec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .sec-box{background:var(--card-hover);padding:10px;border-radius:7px;text-align:center}
        .sec-label{color:var(--dim);font-size:8px;text-transform:uppercase;letter-spacing:.05em}
        .sec-val{font-size:18px;font-weight:800;margin-top:3px;font-family:var(--mono)}

        /* WhatsApp preview bubble */
        .wa-bubble{background:#111b21;border:1px solid var(--bdr);border-radius:12px;padding:16px;font-size:12px;line-height:1.6;color:#e9edef;max-width:340px;margin:0 auto}
        .wa-header{color:#00a884;font-weight:600;margin-bottom:8px;font-size:13px}
        .wa-footer{color:#667781;font-size:10px;border-top:1px solid var(--bdr);padding-top:8px;margin-top:10px}
        .wa-btn{display:inline-block;padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;margin-top:10px;margin-right:6px}
        .wa-btn.primary{background:rgba(0,168,132,.15);color:#00a884;border:1px solid rgba(0,168,132,.3)}
        .wa-btn.secondary{background:var(--bdr);color:#8696a0;border:1px solid rgba(0,0,0,.08)}

        /* Live activity ticker */
        .ticker{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
        .tick-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:5px;background:var(--card);border:1px solid var(--bdr);font-size:10px;animation:slideIn .3s ease both}
        .tick-actor{width:64px;font-size:8px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;flex-shrink:0}
        .tick-ts{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:9px;flex-shrink:0}

        /* Forecast bars */
        .fc-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
        .fc-day{width:74px;font-size:10px;color:var(--sec);flex-shrink:0}
        .fc-bar{flex:1;height:14px;background:var(--bdr);border-radius:4px;overflow:hidden}
        .fc-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:4px;animation:slideR .8s ease both}
        .fc-amt{width:80px;text-align:right;font-family:var(--mono);font-size:10px;font-weight:600;flex-shrink:0}

        /* Waterfall */
        .wf-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
        .wf-label{width:130px;font-size:10px;color:var(--sec);flex-shrink:0}
        .wf-bar{flex:1;height:18px;background:var(--bdr);border-radius:4px;overflow:hidden}
        .wf-fill{height:100%;border-radius:4px;animation:slideR .9s ease both}
        .wf-amt{width:92px;text-align:right;font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}

        /* Merchant profile cards */


        /* Signal list */


        /* JSON output block */
        .json-out{background:var(--card);padding:10px;border-radius:5px;font-family:var(--mono);font-size:10px;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:10px;border:1px solid var(--bdr)}

        /* Calibration row */

<body>
    <canvas id="particle-canvas"></canvas>
    <div id="root"></div>
    <script>
    // ── Paytm-branded particle system (2D canvas, zero deps) ──
    (function(){
        const cvs=document.getElementById('particle-canvas');
        const ctx=cvs.getContext('2d');
        let W,H;
        const particles=[];
        const CONNECTION_DIST=120;
        const PARTICLE_COUNT=80;
        const CYAN=[0,186,242];  // Paytm cyan #00BAF2
        let mouse={x:-1000,y:-1000};

        function resize(){W=cvs.width=window.innerWidth;H=cvs.height=window.innerHeight}
        window.addEventListener('resize',resize);
        resize();

        document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

        class Particle{
            constructor(){
                this.x=Math.random()*W;
                this.y=Math.random()*H;
                this.vx=(Math.random()-.5)*.4;
                this.vy=(Math.random()-.5)*.4;
                this.r=1.5+Math.random()*1.5;
                this.alpha=.3+Math.random()*.4;
            }
            update(){
                this.x+=this.vx;
                this.y+=this.vy;
                if(this.x<0)this.x=W;
                if(this.x>W)this.x=0;
                if(this.y<0)this.y=H;
                if(this.y>H)this.y=0;
                // Mouse repel
                const dx=this.x-mouse.x,dy=this.y-mouse.y;
                const dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<150){
                    const force=(150-dist)/150*.02;
                    this.vx+=dx/dist*force;
                    this.vy+=dy/dist*force;
                }
                // Dampen
                this.vx*=.999;
                this.vy*=.999;
            }
            draw(){
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
                ctx.fillStyle=`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},${this.alpha})`;
                ctx.fill();
            }
        }

        for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());

        function drawConnections(){
            for(let i=0;i<particles.length;i++){
                for(let j=i+1;j<particles.length;j++){
                    const dx=particles[i].x-particles[j].x;
                    const dy=particles[i].y-particles[j].y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<CONNECTION_DIST){
                        const alpha=(1-dist/CONNECTION_DIST)*.15;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x,particles[i].y);
                        ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle=`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},${alpha})`;
                        ctx.lineWidth=.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate(){
            ctx.clearRect(0,0,W,H);
            particles.forEach(p=>{p.update();p.draw()});
            drawConnections();
            requestAnimationFrame(animate);
        }
        animate();
    })();

    // ── GSAP entrance animation ──
    window.addEventListener('DOMContentLoaded',function(){
        if(typeof gsap==='undefined')return;

        // Content fade up
        gsap.from('.content',{y:30,opacity:0,duration:.5,ease:'power2.out',delay:.4});
    });

    </script>
    <script>window.__API_BASE__ = "";</script>
    <script type="text/babel">
    const {useState,useEffect,useRef,useCallback,Fragment} = React;
    const API = (typeof window !== 'undefined' && window.__API_BASE__) || location.origin;
    const fmt = p => {if(p==null||isNaN(p))return"—";const r=p/100;if(Math.abs(r)>=1e7)return`₹${(r/1e7).toFixed(2)} Cr`;if(Math.abs(r)>=1e5)return`₹${(r/1e5).toFixed(2)} L`;const d=Math.abs(r)<100?2:0;return`₹${r.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d})}`};
    const pct = (x,d=1)=>((x||0)*100).toFixed(d);
    const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const label = t => {if(!t)return"";const m={"INSUFFICIENT_FUNDS":"Insufficient Funds","HARD_DECLINE":"Hard Decline","NETWORK_TIMEOUT":"Network Timeout","3DS_OTP_CHALLENGE_TIMEOUT":"3DS OTP Timeout","GATEWAY_TIMEOUT":"Gateway Timeout","ISSUER_UNAVAILABLE":"Issuer Unavailable","SUBSCRIPTION_FAILED":"Subscription Failed","CUSTOMER_ABANDONMENT":"Customer Abandonment","INVOICE_OVERDUE":"Invoice Overdue","PRICE_SHOCK":"Price Shock","LATE_AUTH":"Late Auth","NETWORK_FAILURE":"Network Failure","CARD_EXPIRED":"Card Expired","OVERDUE_GENUINE":"Overdue Genuine","PAYMENT_DECLINED":"Payment Declined"};return m[t]||t.replace(/_/g," ").replace(/\b\w/g,l=>l.toUpperCase())};
    const FAILURE_TYPES=["INSUFFICIENT_FUNDS","HARD_DECLINE","NETWORK_TIMEOUT","3DS_OTP_CHALLENGE_TIMEOUT","GATEWAY_TIMEOUT","ISSUER_UNAVAILABLE","SUBSCRIPTION_FAILED","CUSTOMER_ABANDONMENT"];
    // Paytm brand palette (dashboard.css is the source of truth)
    const PAYTM_NAVY="#002970",PAYTM_CYAN="#00BAF2",PAYTM_CRIMSON="#E42352";
    const CHANNEL_COLORS={whatsapp:"#22c55e",sms:PAYTM_CYAN,email:"#a78bfa",voice:"#eab308",retry:"#64748b",payment_link:"#4ade80",other:"#94a3b8"};

    // ── Audio ──
    const AudioCtx=(()=>{let ctx=null;return()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}})();
    function playTriad(){const ctx=AudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();[659.25,987.77,1318.51].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.07;o.connect(g).connect(ctx.destination);const t=ctx.currentTime+i*0.12;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.stop(t+0.6)})}
    function burstConfetti(cvs){const ctx=cvs.getContext('2d');const W=cvs.width=cvs.offsetWidth;const H=cvs.height=cvs.offsetHeight;const ps=Array.from({length:50},()=>({x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*9-3,r:3+Math.random()*5,life:1}));    const cols=[PAYTM_CYAN,PAYTM_NAVY,'#22c55e','#eab308',PAYTM_CRIMSON,'#4ade80','#a78bfa'];(function f(){ctx.clearRect(0,0,W,H);let a=0;ps.forEach(p=>{if(p.life<=0)return;a++;p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=.016;ctx.globalAlpha=p.life;ctx.fillStyle=cols[~~(Math.random()*cols.length)];ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r*p.life),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(a>0)requestAnimationFrame(f)})()}
    window.addEventListener('recovery-complete',()=>{playTriad();const c=document.getElementById('confetti-canvas');if(c)burstConfetti(c)});

    // ── P0: guided tour — spotlight walk of the judge-critical surfaces ──
    const TOUR_STEPS=[
        {sel:".hero",title:"The headline: incremental, not gross",body:"₹ recovered measured against a randomized control group — with a 95% bootstrap CI. The naive-retry bar shows what a dumb strategy earns; the gap is the agent's value.",tab:"hub"},
        {sel:".metrics",title:"Four numbers that survive scrutiny",body:"Recovery rate vs control, the lift with its CI, incremental money, and the amount at risk. Every figure reproducible with --seed 42.",tab:"hub"},
        {sel:".funnel",title:"Where cases fall out of the funnel",body:"Failed events → policy-eligible → interventions → settled recoveries, with drop-offs named: attempt caps, opt-outs, promises paused.",tab:"hub"},
        {sel:".tick-row",title:"The agent, live",body:"Every classification, policy verdict, and execution streams in from the running engine — this is the audit trail as it happens.",tab:"hub"},
        {sel:".nav-item:nth-child(1)",title:"Case Ledger",body:"Every case, every decision. Click a row, then Explain / Decision EV to see the full reasoning chain and rejected alternatives.",tab:"ledger",nav:true},
        {sel:".card",title:"Decision inspector",body:"Expected value for every candidate action, the winner, and why the rest were rejected — policy blocks and economic stops included.",tab:"ledger",skipIfNoCases:true},
        {sel:".metrics",title:"Engine & ROI",body:"UCB1 bandit state, CUSUM change-point detector, checkout simulator, and a live merchant ROI calculator driven by config economics.",tab:"engine"},
        {sel:".hero",title:"Trust is the product",body:"SHA-256 chained audit trail (verify it live), 8/8 threats mitigated, adversarial LLM test — compliance is a structural gate, not a promise.",tab:"security"},
        {sel:".tb-right",title:"Run it yourself",body:"Run Batch re-seeds the whole cohort in front of you. The numbers you just saw are reproducible — that's the point.",tab:"hub"},
    ];
    function Tour({idx,setIdx,onClose,setTab}){
        const step=TOUR_STEPS[idx];
        const[rect,setRect]=useState(null);
        useEffect(()=>{
            if(!step)return;
            if(step.tab)setTab(step.tab);
            const t=setTimeout(()=>{
                const el=document.querySelector(step.sel);
                if(el){el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>{const r=el.getBoundingClientRect();setRect({top:r.top-6,left:r.left-6,width:r.width+12,height:r.height+12})},350)}
                else setRect(null);
            },60);
            return()=>clearTimeout(t);
        },[idx]);
        useEffect(()=>{
            const h=e=>{if(e.key==="Escape")onClose();if(e.key==="ArrowRight"&&idx<TOUR_STEPS.length-1)setIdx(idx+1);if(e.key==="ArrowLeft"&&idx>0)setIdx(idx-1)};
            window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
        },[idx,onClose,setIdx]);
        if(!step)return null;
        // card placement: below the spotlight when it fits, above otherwise, centered fallback
        let cardStyle={left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:340};
        if(rect){
            const below=rect.top+rect.height+230<window.innerHeight;
            const top=below?rect.top+rect.height+14:Math.max(12,rect.top-224);
            cardStyle={left:Math.max(12,Math.min(rect.left,window.innerWidth-356)),top,width:344};
        }
        return(
            <>
                <div className="tour-backdrop" onClick={onClose}/>
                {rect&&<div className="tour-spot" style={{top:rect.top,left:rect.left,width:rect.width,height:rect.height}} onClick={onClose}/>}

    // ── Main App ──
    function App(){

        const fetchBaseline=useCallback(async()=>{
            try{

                    `${API}/report/baseline`,`${API}/cases/recent?limit=50`,
                    `${API}/security/report`,`${API}/budget`,
                    `${API}/analytics/bandit`,`${API}/analytics/cusum`,

                if(ok(6))setIncidents(await json(6));
                if(ok(7))setApproval(await json(7));
                if(ok(8))setFunnel(await json(8));
                if(ok(9)||ok(10)||ok(11))setEngineStats({forecast:ok(9)?await json(9):null,calibration:ok(10)?await json(10):null,benchmark:ok(11)?await json(11):null});

            setSeedRun({current:0,total:0});
            const es=new EventSource(`${API}/batch/run/stream?seed=42&cases=200&rehearsed=true`);
            es.onmessage=e=>{
                const raw=(e.data||"").trim();
                if(/^\d+$/.test(raw)){setSeedRun({current:0,total:parseInt(raw,10)});return}
                if(raw.startsWith("done")){
                    es.close();setSeedRun(null);
                    fetchBaseline();
                    try{window.dispatchEvent(new Event('recovery-complete'))}catch(err){}
                    return;
                }
                const m=raw.match(/^(\d+)\/(\d+) processing/);
                if(m)setSeedRun({current:parseInt(m[1],10),total:parseInt(m[2],10)});
            };
            es.onerror=()=>{es.close();setSeedRun(null);runBatch()};
        },[seedRun,runBatch,fetchBaseline,API]);

        const runBatch=useCallback(()=>{
            if(running)return;setRunning(true);setProgress({current:0,total:1});setLiveRep(null);
            const wsHost=location.hostname.endsWith('.vercel.app')?'paytm-recovery-agent.onrender.com':location.host;
            const wsProto=location.protocol==='https:'?'wss:':'ws:';
            const ws=new WebSocket(`${wsProto}//${wsHost}/ws/replay?seed=42&cases=200`);
            wsRef.current=ws;
            ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==="start")setProgress({current:0,total:msg.total});else if(msg.type==="progress")setProgress({current:msg.current,total:msg.total});else if(msg.type==="done"){setLiveRep(msg.report);setRunning(false);ws.close();fetch(`${API}/cases/recent?limit=50`).then(r=>r.json()).then(d=>{if(d.cases)setCases(d.cases)}).catch(()=>{});setLastUpdated(new Date());try{window.dispatchEvent(new Event('recovery-complete'))}catch(e){}}else if(msg.type==="error"){setRunning(false);ws.close()}}catch(err){}};
            ws.onerror=()=>setRunning(false);ws.onclose=()=>setRunning(false);
        },[running]);

        const dismissLive=useCallback(()=>setLiveRep(null),[]);
        const skipSeed=useCallback(()=>{setSeedRun(null)},[]);
        useEffect(()=>{return()=>{if(wsRef.current)wsRef.current.close();if(esRef.current)esRef.current.close()}},[]);

        // SSE live ticker — auto-connects once cases exist
        useEffect(()=>{
            if(loading||error||!cases.length||esRef.current)return;
            const es=new EventSource(`${API}/stream/events`);
            esRef.current=es;
            es.onmessage=e=>{try{const ev=JSON.parse(e.data);setTicker(t=>[ev,...t].slice(0,25));setSseEvents(e2=>[ev,...e2].slice(0,30))}catch(err){}};
            es.onerror=()=>{};
            return()=>{es.close();esRef.current=null};
        },[loading,error,cases.length,API]);

        // Skeleton loader
        if(loading)return(
            <div className="layout">
                <aside className="sidebar"><div className="sidebar-logo"><h1><span className="logo-chip">P</span>Paytm Agent</h1><div className="sub">Revenue Recovery</div></div></aside>
                <div className="main"><div className="content" style={{padding:40}}>
                    <div className="skeleton sk-card" style={{height:180,marginBottom:16}}></div>
                    <div className="metrics">{[1,2,3,4].map(i=><div key={i} className="skeleton sk-card"></div>)}</div>
                    <div className="grid-2">{[1,2].map(i=><div key={i} className="skeleton sk-card" style={{height:260}}></div>)}</div>
                </div></div>
            </div>
        );
        if(error)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{textAlign:"center"}}><p style={{fontSize:16,marginBottom:8}}>Failed to load report</p><p style={{color:"var(--dim)",fontSize:11}}>Start with: <code className="mono">uvicorn app.main:app --port 8000</code></p><button className="btn" style={{marginTop:12}} onClick={fetchBaseline}>Retry</button></div></div>;

        const active=liveRep||rep;
        const hd=active?.headline||{},batch=active?.batch||{},cost=active?.cost||{},perClass=active?.per_class||{},promises=active?.promises||{};
        const heroJump=()=>{setTab("hub");setTimeout(()=>{const el=document.querySelector(".hero");if(!el)return;el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1100)},120)};
        const naiveRate=hd.naive_recovery_rate!=null?hd.naive_recovery_rate:null;
        const blocks=active.policy_transparency?.blocked_actions||{};
        const cpir=cost.cost_per_incremental_recovery_paise;

        return(
            <>
            <canvas id="confetti-canvas" style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:999}}/>
            {toast&&<div className="toast">{toast}</div>}
            {seedRun&&<SeedOverlay progress={seedRun} onSkip={skipSeed}/>}
            {tourIdx!=null&&<Tour idx={tourIdx} setIdx={setTourIdx} onClose={()=>setTourIdx(null)} setTab={setTab}/>}

            <div className="layout">
                <aside className="sidebar">
                    <div className="sidebar-logo"><h1><span className="logo-chip">P</span>Paytm Agent</h1><div className="sub">Revenue Recovery</div></div>
                    <nav className="nav">
                        <div className="nav-section">Core</div>
                        {[{id:"hub",icon:"📊",label:"Dashboard"},{id:"ledger",icon:"📋",label:"Case Ledger"}].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                        <div className="nav-section">Intelligence</div>
                        {[{id:"engine",icon:"⚙️",label:"Engine & ROI"},{id:"analytics",icon:"📈",label:"Analytics"}].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                        <div className="nav-section">Operations</div>
                        {[{id:"tools",icon:"🛠",label:"Tools"},{id:"security",icon:"🛡",label:"Security"}].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                        <div className="nav-section">Agent</div>
                        {[{id:"agent",icon:"🤖",label:"Agent Control"},{id:"reflection",icon:"🧠",label:"Reflection"},{id:"learning",icon:"📚",label:"Learning"},{id:"onboarding",icon:"🚀",label:"Setup"}].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                    </nav>
                    <div className="sidebar-footer">Paytm Recovery Agent
                        <div className="sidebar-disclaimer">Built as a concept for the Paytm Hackathon. Not an official Paytm product.</div>
                    </div>
                </aside>

                <div className="main">
                    <div className="topbar">
                        <div className="tb-left">
                            {running&&<span className="badge live">LIVE</span>}
                            {running&&<span style={{fontSize:10,color:"var(--blu)"}}>{progress.total>1?`${progress.current}/${progress.total}`:"Running…"}</span>}
                            {!running&&<span className="badge">{batch.cases||"—"} cases</span>}
                            {lastUpdated&&<span style={{fontSize:9,color:"var(--dim)",fontFamily:"var(--mono)"}}>updated {lastUpdated.toLocaleTimeString()}</span>}
                        </div>
                        <div className="kpi-strip" title="Click to jump to the hero">
                            <div className="kpi-chip" onClick={()=>heroJump()}><span className="kpi-v">+{(hd.incremental_recovery_pp||0).toFixed(1)}pp</span><span className="kpi-l">lift</span></div>
                            <div className="kpi-chip" onClick={()=>heroJump()}><span className="kpi-v">{fmt(hd.incremental_money_paise)}</span><span className="kpi-l">incremental</span></div>
                            <div className="kpi-chip" onClick={()=>heroJump()}><span className="kpi-v">{pct(hd.recovery_rate_treatment)}%</span><span className="kpi-l">vs {pct(hd.recovery_rate_control)}% control</span></div>
                        </div>
                        <div className="tb-right">
                            <button className="btn btn-sm btn-outline" onClick={()=>{setTab("hub");setTourIdx(0)}}>▶ Tour</button>
                            <div className="sound-toggle" onClick={()=>{setSoundEnabled(!soundEnabled);notify(soundEnabled?"Muted":"Sound on")}}>{soundEnabled?"🔊":"🔇"}</div>
                            <div className={`sound-toggle ${autoPilot?"tag-blue":""}`} onClick={()=>{setAutoPilot(!autoPilot);notify(autoPilot?"Auto-pilot off":"Auto-pilot on")}} style={autoPilot?{borderColor:"rgba(0,41,112,.4)",color:"var(--blu)"}:{}}>
                                {autoPilot?"⚡ AUTO":"⚡ OFF"}
                            </div>
                            <button className="btn btn-sm btn-outline" onClick={fetchBaseline} disabled={running}>↻</button>
                            <button className="btn btn-sm" onClick={runBatch} disabled={running}>{running?"Running…":"Run Batch"}</button>
                        </div>
                    </div>

                    <div className="content">
                        {!active&&!loading&&<div style={{background:"rgba(234,179,8,.08)",border:"1px solid rgba(234,179,8,.25)",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:11,color:"var(--yel)",display:"flex",alignItems:"center",gap:8}}>
                            ⏳ Render is waking up (free tier cold start). Dashboard data will appear shortly. <button className="btn btn-xs btn-outline" onClick={fetchBaseline} style={{fontSize:10}}>Retry</button>
                        </div>}
                        {tab==="hub"&&<HubTab hd={hd} batch={batch} cost={cost} perClass={perClass} promises={promises} blocks={blocks} cpir={cpir} naiveRate={naiveRate} cases={cases} running={running} progress={progress} liveRep={liveRep} dismissLive={dismissLive} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API} funnel={funnel} approval={approval} budget={budget} ticker={ticker}/>}
                        {tab==="ledger"&&<LedgerTab cases={cases} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API} notify={notify}/>}
                        {tab==="engine"&&<EngineTab bandit={bandit} cusum={cusum} budget={budget} incidents={incidents} API={API} notify={notify} engineStats={engineStats} merchant={merchant} setMerchant={setMerchant} sseEvents={sseEvents}/>}
                        {tab==="analytics"&&<AnalyticsTab summary={summary} setSummary={setSummary} API={API}/>}
                        {tab==="tools"&&<ToolsTab API={API} notify={notify}/>}
                        {tab==="security"&&<SecurityTab security={security} API={API} notify={notify}/>}
                        {tab==="agent"&&<AgentControlTab API={API} notify={notify}/>}
                        {tab==="reflection"&&<ReflectionTab API={API} notify={notify}/>}
                        {tab==="learning"&&<LearningTab API={API} notify={notify}/>}
                        {tab==="onboarding"&&<OnboardingTab API={API} notify={notify}/>}
                    </div>
                </div>
            </div>

            <AuditModal open={auditOpen} onClose={()=>setAuditOpen(false)} caseId={selectedCase} API={API}/>
            </>
        );
    }

    // ── Live Ticker (Dashboard) ──
    function LiveTicker({ticker}){
        if(!ticker.length)return null;
        const actorColor={classifier:"var(--blu)",selector:"var(--pur)",executor:"var(--grn)",policy:"var(--yel)",world:"var(--cyn)",system:"var(--dim)",customer:"var(--red)",human:"var(--red)"};
        return(
            <div className="card a-fu" style={{marginBottom:16}}>
                <div className="card-header"><h2>🔴 Live Activity</h2><span className="tag-blue tag">SSE stream</span></div>
                <div className="card-body"><div className="ticker">
                    {ticker.map((ev,i)=><div key={ev.idx+"-"+i} className="tick-row" style={{opacity:1-(i*0.03)}}>
                        <span className="tick-actor" style={{color:actorColor[ev.actor]||"var(--dim)"}}>{ev.actor}</span>
                        <span style={{fontWeight:600}}>{(ev.event_type||"").replace(/[._]/g," ")}</span>
                        <span className="mono" style={{color:"var(--dim)",fontSize:9}}>{ev.case_id?String(ev.case_id).slice(0,12):""}</span>
                        <span className="tick-ts">{ev.amount_display||""}</span>
                    </div>)}
                </div></div>
            </div>
        );
    }

    // ── Hub Tab ──
    function HubTab({hd,batch,cost,perClass,promises,blocks,cpir,naiveRate,cases,running,progress,liveRep,dismissLive,onCaseClick,API,funnel,approval,budget,ticker}){
        const ci=hd.incremental_recovery_ci95_pp||[0,0];
        const lift=hd.incremental_recovery_pp||0;
        const classRef=useRef(null);
        const spendRef=useRef(null);
        const charts=useRef({});

        useEffect(()=>{
            if(charts.current.cls)charts.current.cls.destroy();
            const entries=Object.entries(perClass).sort((a,b)=>b[1].lift_pp-a[1].lift_pp);
            if(entries.length&&classRef.current){
                charts.current.cls=new Chart(classRef.current,{type:"bar",data:{labels:entries.map(([c])=>c.replace(/_/g," ").toLowerCase()),datasets:[{label:"Treatment %",data:entries.map(([,d])=>pct(d.treatment_rate,1)),backgroundColor:"#002970",borderRadius:3},{label:"Control %",data:entries.map(([,d])=>pct(d.control_rate,1)),backgroundColor:"#94a3b8",borderRadius:3}]},options:{responsive:true,plugins:{legend:{labels:{color:"#666666",font:{size:10}}}},scales:{x:{ticks:{color:"#666666",font:{size:9}},grid:{color:"rgba(0,0,0,0.04)"}},y:{beginAtZero:true,max:100,ticks:{color:"#666666",callback:v=>v+"%"},grid:{color:"rgba(0,0,0,0.04)"}}}}});
            }
            if(charts.current.spend)charts.current.spend.destroy();
            const chs=Object.entries(cost.cost_by_channel_paise||{}).filter(([,v])=>v>0).map(([k,v])=>({n:k,v}));
            if(chs.length&&spendRef.current){
                charts.current.spend=new Chart(spendRef.current,{type:"doughnut",data:{labels:chs.map(c=>`${c.n.charAt(0).toUpperCase()+c.n.slice(1)} · ${fmt(c.v)}`),datasets:[{data:chs.map(c=>c.v),backgroundColor:chs.map(c=>CHANNEL_COLORS[c.n]||"#94a3b8")}]},options:{responsive:true,cutout:"55%",plugins:{legend:{position:"bottom",labels:{color:"#94a3b8",padding:10,font:{size:10}}}}}});
            }
        },[perClass,cost]);

        const conv=funnel&&funnel.conversion_rates||{};

        return(
            <>
                {liveRep&&<div style={{background:"rgba(0,41,112,.06)",border:"1px solid rgba(0,41,112,.2)",borderRadius:8,padding:"7px 12px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11}}>
                    <span style={{color:"var(--blu)",fontWeight:600}}>LIVE results from batch run</span>
                    <button className="btn btn-xs btn-outline" onClick={dismissLive}>Show baseline</button>
                </div>}

                {/* Hero */}
                <div className="hero a-fu">
                    <div>
                        <div className="h-label">Incremental recovery vs control</div>
                        <div className="h-amt">{fmt(hd.incremental_money_paise)}</div>
                        <div className="h-sub">+{lift.toFixed(1)} percentage points lift</div>
                        <div className="h-ci">95% CI [+{ci[0]}, +{ci[1]}] · 2,000 bootstrap resamples</div>
                    </div>
                    <div>
                        <div className="bar-g"><div className="bar-l"><span>Treatment (agent)</span><span>{pct(hd.recovery_rate_treatment)}%</span></div><div className="bar"><div className="bf t" style={{width:pct(hd.recovery_rate_treatment)+"%"}}></div></div></div>
                        <div className="bar-g"><div className="bar-l"><span>Control (no agent)</span><span>{pct(hd.recovery_rate_control)}%</span></div><div className="bar"><div className="bf c" style={{width:pct(hd.recovery_rate_control)+"%"}}></div></div></div>
                        {naiveRate!=null&&<div className="bar-g"><div className="bar-l"><span>Naive retry</span><span>{pct(naiveRate)}%</span></div><div className="bar"><div className="bf n" style={{width:pct(naiveRate)+"%"}}></div></div></div>}
                        <div className="h-delta"><div className="h-dv">+{fmt(hd.incremental_money_paise)}</div><div className="h-dl">incremental money recovered</div></div>
                    </div>
                </div>

                {/* Metrics */}
                <div className="metrics">
                    <div className="metric a-fu d1"><div className="metric-label">Recovery rate</div><div className="metric-value tabular">{pct(hd.recovery_rate_treatment)}%</div><div className="metric-sub">control {pct(hd.recovery_rate_control)}%</div></div>
                    <div className="metric a-fu d2"><div className="metric-label">Incremental lift</div><div className="metric-value tabular" style={{color:"var(--grn)"}}>+{(hd.incremental_recovery_pp||0).toFixed(1)} pp</div><div className="metric-sub">95% CI [+{ci[0]}, +{ci[1]}]</div></div>
                    <div className="metric primary a-fu d3"><div className="metric-label">Money recovered</div><div className="metric-value tabular">{fmt(hd.incremental_money_paise)}</div><div className="metric-sub">incremental vs control</div></div>
                    <div className="metric a-fu d4"><div className="metric-label">Amount at risk</div><div className="metric-value tabular">{fmt(batch.amount_at_risk_paise)}</div><div className="metric-sub">across {batch.cases} cases</div></div>
                </div>

                {/* Recovery Funnel */}
                {funnel&&funnel.stages&&<div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>Recovery Funnel</h2>{conv.overall_rate!=null&&<span className="tag-green tag">{pct(conv.overall_rate,1)}% end-to-end</span>}</div>
                    <div className="card-body">
                        <div className="funnel">
                            {funnel.stages.map((s,i)=>(
                                <Fragment key={i}>
                                    {i>0&&<span className="funnel-arrow">→</span>}
                                    <div className="funnel-stage">
                                        <div className="funnel-num" style={{color:i===funnel.stages.length-1?"var(--grn)":"var(--txt)"}}>{s.count}</div>
                                        <div className="funnel-label">{s.label}</div>
                                        {s.dropoff_pct!=null&&<div style={{fontSize:8,color:"var(--red)",marginTop:2}}>-{s.dropoff_pct.toFixed(0)}%</div>}
                                    </div>
                                </Fragment>
                            ))}
                        </div>
                        {funnel.drop_offs&&Object.keys(funnel.drop_offs).length>0&&<div className="chips" style={{marginTop:10}}>
                            {Object.entries(funnel.drop_offs).map(([k,v])=><span key={k} className="chip">{esc(k.replace(/_/g," "))} · {v}</span>)}
                        </div>}
                    </div>
                </div>}

                {/* Live ticker */}
                <LiveTicker ticker={ticker}/>

                {/* SMB Health Score */}
                <div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>🏥 Merchant Health Score</h2></div>
                    <div className="card-body" style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:20,alignItems:"center"}}>
                        <div style={{textAlign:"center"}}>
                            <svg viewBox="0 0 120 120" width="120" height="120">
                                <circle cx="60" cy="60" r="50" fill="none" stroke="var(--bdr)" strokeWidth="10"/>
                                <circle cx="60" cy="60" r="50" fill="none" stroke={hd.recovery_rate_treatment>0.5?"var(--grn)":hd.recovery_rate_treatment>0.3?"var(--yel)":"var(--red)"} strokeWidth="10" strokeDasharray={`${(hd.recovery_rate_treatment||0)*314} 314`} strokeLinecap="round" transform="rotate(-90 60 60)" style={{transition:"stroke-dasharray .6s ease"}}/>
                                <text x="60" y="56" textAnchor="middle" fontSize="22" fontWeight="800" fontFamily="var(--mono)" fill="var(--txt)">{pct(hd.recovery_rate_treatment||0)}</text>
                                <text x="60" y="72" textAnchor="middle" fontSize="9" fill="var(--dim)" textTransform="uppercase" letterSpacing=".04em">recovery rate</text>
                            </svg>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
                            <div className="sec-box"><div className="form-label">Recovery Rate</div><div className="mono" style={{fontSize:14,fontWeight:700,color:hd.recovery_rate_treatment>0.5?"var(--grn)":"var(--yel)"}}>{pct(hd.recovery_rate_treatment||0)}%</div><div style={{fontSize:9,color:"var(--dim)"}}>vs {pct(hd.recovery_rate_control||0)}% control</div></div>
                            <div className="sec-box"><div className="form-label">Cost Efficiency</div><div className="mono" style={{fontSize:14,fontWeight:700}}>{cpir!=null?fmt(cpir):"—"}</div><div style={{fontSize:9,color:"var(--dim)"}}>cost per recovery</div></div>
                            <div className="sec-box"><div className="form-label">Compliance</div><div className="mono" style={{fontSize:14,fontWeight:700,color:cost.opt_outs>0?"var(--grn)":"var(--txt)"}}>{cost.opt_outs||0}</div><div style={{fontSize:9,color:"var(--dim)"}}>opt-outs honored</div></div>
                            <div className="sec-box"><div className="form-label">Promise Keeping</div><div className="mono" style={{fontSize:14,fontWeight:700}}>{promises.keep_rate!=null?pct(promises.keep_rate,0)+"%":"—"}</div><div style={{fontSize:9,color:"var(--dim)"}}>PTP honor rate</div></div>
                            <div className="sec-box"><div className="form-label">Policy Pass Rate</div><div className="mono" style={{fontSize:14,fontWeight:700}}>{pct(1-((blocks&&Object.values(blocks).reduce((a,b)=>a+b,0)||0)/Math.max(cases.length,1)),0)}%</div><div style={{fontSize:9,color:"var(--dim)"}}>actions approved</div></div>
                            <div className="sec-box"><div className="form-label">Redundancy</div><div className="mono" style={{fontSize:14,fontWeight:700,color:cost.redundant_contact_share>0.1?"var(--red)":"var(--grn)"}}>{pct(cost.redundant_contact_share||0,0)}%</div><div style={{fontSize:9,color:"var(--dim)"}}>duplicate contacts</div></div>
                        </div>
                    </div>
                </div>

                {/* Compliance + Approval */}
                <div className="grid-4" style={{marginBottom:16}}>
                    <div className="card card-body a-fu d1"><div className="metric-label">Redundant contacts</div><div className="metric-value tabular">{pct(cost.redundant_contact_share,0)}%</div><div className="metric-sub">would have paid anyway</div></div>
                    <div className="card card-body a-fu d2"><div className="metric-label">Opt-outs honored</div><div className="metric-value tabular">{cost.opt_outs||0}</div><div className="metric-sub">every one respected</div></div>
                    <div className="card card-body a-fu d3"><div className="metric-label">Promises-to-pay</div><div className="metric-value tabular">{promises.received||0}</div><div className="metric-sub">{promises.keep_rate!=null?pct(promises.keep_rate,0)+"% keep":"none yet"}</div></div>
                    <div className="card card-body a-fu d4"><div className="metric-label">Cost per recovery</div><div className="metric-value tabular">{cpir!=null?fmt(cpir):"—"}</div><div className="metric-sub">{cost.contacts_executed||0} contacts</div></div>
                </div>

                {/* Approval Queue inline */}
                {approval&&approval.count>0&&<div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>✋ Approval Queue</h2><span className="badge warn">{approval.count} pending</span></div>
                    <div className="card-body">
                        {(approval.queue||[]).slice(0,3).map(c=><div key={c.case_id} className="approval-row">
                            <div><span style={{fontWeight:600}}>{c.customer}</span><span style={{color:"var(--dim)",marginLeft:6,fontSize:10}}>{label(c.failure_class)}</span></div>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <span className="mono tabular" style={{fontWeight:700}}>{fmt(c.amount_paise)}</span>
                                <button className="btn btn-xs btn-grn" onClick={async()=>{await fetch(`${API}/approval/${c.case_id}/approve`,{method:"POST"});notify("Approved");fetchBaseline?.()}}>Approve</button>
                                <button className="btn btn-xs btn-red" onClick={async()=>{await fetch(`${API}/approval/${c.case_id}/reject`,{method:"POST"});notify("Rejected")}}>Reject</button>
                            </div>
                        </div>)}
                    </div>
                </div>}

                {/* Charts */}
                <div className="grid-2" style={{marginBottom:16}}>

    // ── Ledger Tab ──
    function LedgerTab({cases,onCaseClick,API,notify}){
        const[search,setSearch]=useState("");
        const[statusFilter,setStatusFilter]=useState("all");
        const[classFilter,setClassFilter]=useState("all");
        const[expandedId,setExpandedId]=useState(null);
        const[explainFor,setExplainFor]=useState(null);
        const[explainData,setExplainData]=useState(null);
        const classes=[...new Set(cases.map(c=>c.failure_class).filter(Boolean))];
        const filtered=cases.filter(c=>{
            if(statusFilter!=="all"&&c.status!==statusFilter)return false;
            if(classFilter!=="all"&&c.failure_class!==classFilter)return false;
            if(!search)return true;const q=search.toLowerCase();
            return c.case_id.toLowerCase().includes(q)||(c.failure_class||"").toLowerCase().includes(q)||(c.status||"").toLowerCase().includes(q);
        });
        const exportCsv=useCallback(()=>{
            const rows=[["Case ID","Failure Class","Amount","Status","Group","Recovered"]];
            cases.forEach(c=>rows.push([c.case_id,c.failure_class,c.amount_paise,c.status,c.group||"",c.recovered_amount_paise||""]));
            const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
            const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recovery_ledger.csv";a.click();
        },[cases]);

        const fetchJson=useCallback(async url=>{try{const r=await fetch(url);return r.ok?await r.json():null}catch(e){return null}},[]);

        return(
            <>
                <div className="tab-head" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><h1>Case Ledger</h1><p style={{fontSize:11,color:"var(--dim)",marginTop:3}}>Every case, every decision — click a row for the audit trail.</p></div>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search cases…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
                        <span className="tag">{filtered.length}/{cases.length}</span>
                        <span className="tag-green">{cases.filter(c=>c.status==="recovered").length} recovered</span>
                        <button className="btn btn-xs btn-outline" onClick={exportCsv}>Export CSV</button>
                    </div>
                </div>
                <div className="filter-row" style={{marginBottom:12}}>
                    <span className="form-label" style={{margin:0}}>Status</span>
                    {["all","open","scheduled","recovered","written_off"].map(s=><button key={s} className={`fchip ${statusFilter===s?"on":""}`} onClick={()=>setStatusFilter(s)}>{s.replace(/_/g," ")}</button>)}
                    <span className="form-label" style={{margin:"0 0 0 10px"}}>Class</span>
                    <select className="form-input" style={{width:170}} value={classFilter} onChange={e=>setClassFilter(e.target.value)}>
                        <option value="all">All classes</option>
                        {classes.map(c=><option key={c} value={c}>{label(c)}</option>)}
                    </select>
                </div>
                <div className="card">
                    <div style={{overflowX:"auto"}}>
                        <table><thead><tr><th>Case</th><th>Failure Class</th><th>Amount</th><th>Method</th><th>Status</th><th>Group</th><th>Recovered</th><th>Why</th></tr></thead>
                        <tbody>{filtered.map(c=><Fragment key={c.case_id}>
                            <tr style={{cursor:"pointer",background:expandedId===c.case_id?"rgba(0,0,0,.03)":"transparent"}} onClick={()=>setExpandedId(expandedId===c.case_id?null:c.case_id)}>
                                <td className="mono">{c.case_id.slice(0,12)}</td><td>{label(c.failure_class)}</td><td className="tabular">{fmt(c.amount_paise)}</td><td className="mono" style={{textTransform:"capitalize"}}>{c.method||"—"}</td>
                                <td><span className={`pill ${c.status}`}>{c.status.replace(/_/g," ")}</span></td><td style={{color:c.group==="treatment"?"var(--blu)":"var(--dim)"}}>{c.group||"—"}</td>
                                <td className="tabular">{c.recovered_amount_paise?fmt(c.recovered_amount_paise):"—"}</td>
                                <td><button className="btn btn-xs btn-outline" onClick={e=>{e.stopPropagation();setExpandedId(expandedId===c.case_id?null:c.case_id)}}>{expandedId===c.case_id?"▾":"▸"}</button></td>
                            </tr>
                            {expandedId===c.case_id&&<tr><td colSpan="8" style={{padding:"10px 14px",background:"rgba(0,0,0,.02)"}}>
                                <div className="grid-4" style={{gap:6,marginBottom:8}}>
                                    <div><span className="form-label">Method</span><div className="mono" style={{fontSize:11}}>{c.method||"—"}</div></div>
                                    <div><span className="form-label">Group</span><div style={{fontSize:11,color:c.group==="treatment"?"var(--blu)":"var(--dim)"}}>{c.group||"—"}</div></div>
                                    <div><span className="form-label">Customer</span><div style={{fontSize:11}}>{(c.customer?.name)||"—"}</div></div>
                                    <div><span className="form-label">Written-off reason</span><div style={{fontSize:10,color:"var(--dim)"}}>{c.written_off_reason||"—"}</div></div>
                                </div>
                                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                                    <button className="btn btn-xs" onClick={e=>{e.stopPropagation();onCaseClick(c.case_id)}}>Audit Trail</button>
                                    <button className="btn btn-xs btn-outline" onClick={async e=>{e.stopPropagation();const d=await fetchJson(`${API}/cases/${c.case_id}/uplift`);if(d&&d.best_action)notify(`Best: ${d.best_action.action} · +₹${Math.round((d.best_action.incremental_ev_paise||0)/100)} incremental EV`);else notify("Uplift unavailable")}}>Uplift</button>
                                    <button className="btn btn-xs btn-outline" onClick={async e=>{e.stopPropagation();if(explainFor===c.case_id){setExplainFor(null);return}const d=await fetchJson(`${API}/cases/${c.case_id}/explain`);if(d){setExplainFor(c.case_id);setExplainData(d)}else notify("Explain unavailable")}}>Explain</button>
                                    <button className="btn btn-xs btn-outline" onClick={async e=>{e.stopPropagation();if(explainFor===c.case_id){setExplainFor(null);return}const d=await fetchJson(`${API}/cases/${c.case_id}/decision`);if(d){setExplainFor(c.case_id);setExplainData({decision:d})}else notify("Decision unavailable")}}>Decision EV</button>
                                </div>
                                {explainFor===c.case_id&&explainData&&<ExplainPanel data={explainData}/>}
                            </td></tr>}
                        </Fragment>)}</tbody></table>
                    </div>
                </div>
            </>
        );
    }


    function ExplainPanel({data}){
        const chain=data.explanation_chain||[];
        const dec=data.decision;
        return(
            <div style={{marginTop:8,background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:8,padding:10}}>
                {chain.length>0&&<div>
                    <div style={{fontSize:9,color:"var(--dim)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>Explanation chain</div>
                    {chain.map((s,i)=><div key={i} style={{display:"flex",gap:8,padding:"4px 0",borderBottom:"1px solid var(--bdr)",fontSize:10}}>
                        <span className="tag" style={{flexShrink:0}}>{i+1}. {s.phase}</span>
                        <span style={{color:"var(--sec)"}}>{s.reasoning}</span>
                    </div>)}
                </div>}
                {dec&&<div style={{marginTop:chain.length?10:0}}>
                    <div style={{fontSize:9,color:"var(--dim)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>Decision inspector — selected {dec.selected_action||"—"}</div>
                    {(dec.alternatives||[]).slice(0,5).map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:10,borderBottom:"1px solid var(--bdr)"}}>
                        <span>{r.action}{r.selected&&<span className="tag-green tag" style={{marginLeft:6}}>selected</span>}</span>
                        <span className="mono" style={{color:"var(--dim)"}}>net EV: {fmt(r.net_ev_paise)}</span>
                        <span style={{fontSize:9,color:r.rejected_reason?"var(--red)":"var(--dim)"}}>{r.rejected_reason||""}</span>
                    </div>)}
                </div>}
            </div>
        );
    }
